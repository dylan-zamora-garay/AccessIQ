<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Iniciar sesión - Control Access</title>

    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background:
                radial-gradient(circle at 20% 20%, rgba(255, 102, 0, 0.15), transparent 30%),
                radial-gradient(circle at 80% 80%, rgba(255, 102, 0, 0.12), transparent 30%),
                #050505;
            color: white;
            overflow: hidden;
        }

        /* Cuadrícula de fondo */
        body::before {
            content: "";
            position: absolute;
            inset: 0;
            background-image:
                linear-gradient(rgba(255, 102, 0, 0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 102, 0, 0.04) 1px, transparent 1px);
            background-size: 45px 45px;
            pointer-events: none;
        }

        /* Círculos decorativos */
        .circle {
            position: absolute;
            border: 1px solid rgba(255, 102, 0, 0.2);
            border-radius: 50%;
        }

        .circle-1 {
            width: 300px;
            height: 300px;
            top: -120px;
            left: -100px;
        }

        .circle-2 {
            width: 250px;
            height: 250px;
            bottom: -100px;
            right: -80px;
        }

        .login-card {
            position: relative;
            z-index: 2;
            width: 360px;
            padding: 32px 35px;
            border-radius: 20px;
            border: 1px solid rgba(255, 102, 0, 0.5);
            background: linear-gradient(145deg, #151515, #0b0b0b);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 25px;
        }

        .logo-icon {
            width: 40px;
            height: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #ff7a00, #ff4d00);
            border-radius: 10px;
            font-size: 20px;
            font-weight: bold;
        }

        .logo-text h2 {
            font-size: 19px;
            font-weight: 600;
        }

        .logo-text p {
            font-size: 11px;
            color: #888;
        }

        h1 {
            font-size: 27px;
            margin-bottom: 7px;
        }

        .subtitle {
            color: #888;
            font-size: 14px;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            margin-bottom: 7px;
            color: #ddd;
        }

        .form-group input {
            width: 100%;
            padding: 13px 14px;
            border-radius: 10px;
            border: 1px solid #333;
            background: #101010;
            color: white;
            outline: none;
            font-size: 14px;
            transition: 0.3s;
        }

        .form-group input:focus {
            border-color: #ff6500;
            box-shadow: 0 0 0 2px rgba(255, 101, 0, 0.1);
        }

        .form-group input::placeholder {
            color: #666;
        }

        .error {
            background: rgba(255, 50, 50, 0.1);
            border: 1px solid rgba(255, 50, 50, 0.4);
            color: #ff6b6b;
            padding: 10px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 18px;
            text-align: center;
        }

        .btn-login {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #ff7a00, #ff4d00);
            color: white;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(255, 90, 0, 0.25);
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #888;
            text-decoration: none;
            font-size: 13px;
        }

        .back:hover {
            color: #ff6500;
        }
    </style>
</head>

<body>

    <div class="circle circle-1"></div>
    <div class="circle circle-2"></div>

    <div class="login-card">

        <div class="logo">
            <div class="logo-icon">◉</div>

            <div class="logo-text">
                <h2>AccessIQ</h2>
                <p>Sistema de control de acceso</p>
            </div>
        </div>

        <h1>Iniciar sesión</h1>

        <p class="subtitle">
            Ingresa tus datos para acceder al sistema.
        </p>

        {% if error %}
            <div class="error">
                {{ error }}
            </div>
        {% endif %}

        <form method="POST" action="/login">

            <div class="form-group">
                <label>Usuario</label>

                <input
                    type="text"
                    name="usuario"
                    placeholder="Ingresa tu usuario"
                    required
                >
            </div>

            <div class="form-group">
                <label>Contraseña</label>

                <input
                    type="password"
                    name="contraseña"
                    placeholder="Ingresa tu contraseña"
                    required
                >
            </div>

            <button type="submit" class="btn-login">
                Iniciar sesión
            </button>

        </form>

        <a href="/" class="back">
            ← Volver al inicio
        </a>

    </div>

</body>
</html>
